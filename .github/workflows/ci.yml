# Lint and the full test suite on every pull request and on main (ADR-034).
# Stub model only: no API keys or secrets, and the tests block all outbound
# network (conftest.py). The network is used only to install the locked
# dependencies before the tests run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history: tests/test_month2_rules_before_seal.py checks the commit order.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13 and the locked dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Test (stub model, no network)
        run: make test
