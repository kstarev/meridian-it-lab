[project]
name = "tier0"
version = "0.1.0"
description = "tier0: an AI service desk agent for Meridian (fictional). Runs offline on mocks and fake data."
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp==2.3.0",
    "meridian-dataset",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-semantic-conventions==0.66b2",
    "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
claude = [
    "anthropic==2.6.0",
]

[tool.uv.sources]
meridian-dataset = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
