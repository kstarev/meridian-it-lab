# Workspace root. It is not a package itself: it ties the lab's projects
# together so one `uv sync` installs them all from one uv.lock (ADR-012).
[project]
name = "meridian-it-lab"
version = "0.1.0"
description = "Portfolio lab for IT and security engineering at Meridian, a fictional company. All data is synthetic."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["meridian-access", "meridian-dataset", "meridian-oauth-radar", "tier0"]

[dependency-groups]
dev = [
    "anthropic==2.6.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["access", "dataset", "oauth-radar", "tier0"]

[tool.uv.sources]
meridian-access = { workspace = true }
meridian-dataset = { workspace = true }
meridian-oauth-radar = { workspace = true }
tier0 = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "access/tests", "dataset/tests", "oauth-radar/tests", "tier0/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["tools", "access/src", "dataset/src", "oauth-radar/src", "tier0/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain assert statements.
"**/tests/**" = ["S101"]
# The dataset uses random.Random(seed) on purpose: it must be reproducible, not secret.
"dataset/src/**" = ["S311"]
# This test parses only the repo's own generated SVGs, never outside input.
"tier0/tests/test_docs_img.py" = ["S101", "S314"]
